openapi: 3.0.4
info:
  title: Loan Calculator
  description: >-
    Loan Calculator is a payment calculation API that computes monthly loan
    payments, total interest, and overall loan costs based on principal, annual
    interest rate, and term length. Include an optional down payment to
    determine adjusted financing balances and interest ratios. On paid plans,
    optional inputs add an extra-payment payoff plan with months and interest
    saved, payoff dates from a start date, biweekly or weekly payment figures,
    and an APR that includes upfront fees.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
paths:
  /v1/loanpaymentcalculator:
    post:
      summary: Loan Calculator
      description: >-
        Calculate loan payments based on the loan amount, interest rate, and
        loan term, with optional extra payments, payoff dates, biweekly or
        weekly frequency, and an APR that includes fees
      operationId: loanpaymentcalculator
      parameters: []
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  loanAmount: 32000
                  downpayment: 0
                  interestRate: 8.5
                  loanTerm: 6
                  monthly_payment: 568.91
                  total_interest_paid: 8961.4
                  total_payment: 40961.4
                  interestRatio: 21.88
                  formatted:
                    loanAmount: $32,000.00
                    monthlyPayment: $568.91
                    totalInterestPaid: $8,961.40
                    totalPayment: $40,961.40
                  amortization_schedule:
                    - month: 1
                      interest_payment: 226.67
                      principal_payment: 342.24
                      remaining_balance: 31657.76
                    - month: 2
                      interest_payment: 224.24
                      principal_payment: 344.67
                      remaining_balance: 31313.09
                    - month: 3
                      interest_payment: 221.8
                      principal_payment: 347.11
                      remaining_balance: 30965.99
                  payoff_date: '2032-12-01'
                  extra_payment:
                    extra_monthly_payment: 100
                    monthly_payment: 668.91
                    payoff_months: 59
                    months_saved: 13
                    total_interest_paid: 7214.73
                    total_payment: 39214.73
                    interest_saved: 1746.67
                    payoff_date: '2031-11-01'
                    amortization_schedule:
                      - month: 1
                        interest_payment: 226.67
                        principal_payment: 442.24
                        remaining_balance: 31557.76
                      - month: 2
                        interest_payment: 223.53
                        principal_payment: 445.37
                        remaining_balance: 31112.38
                      - month: 3
                        interest_payment: 220.38
                        principal_payment: 448.53
                        remaining_balance: 30663.86
                  payment_frequency:
                    frequency: biweekly
                    payments_per_year: 26
                    number_of_payments: 156
                    payment: 262.19
                    total_interest_paid: 8901.77
                    total_payment: 40901.77
                    interest_saved: 59.62
                  fees: 800
                  apr: 9.419
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                loanAmount:
                  type: number
                  description: The loan amount
                interestRate:
                  type: number
                  description: The interest rate (percentage)
                loanTerm:
                  type: integer
                  description: The loan term in years
                downpayment:
                  type: number
                  description: >-
                    Amount paid up front, subtracted from the loan amount before
                    interest is applied
                extraPayment:
                  type: number
                  description: >-
                    Extra principal paid every month. Adds an extra_payment
                    block with the early payoff month, months saved and interest
                    saved
                startDate:
                  type: string
                  description: >-
                    Loan start date (YYYY-MM-DD), with the first payment one
                    month later. Adds the payoff date
                paymentFrequency:
                  type: string
                  description: >-
                    Also price the loan on a biweekly (26 a year) or weekly (52
                    a year) schedule. Adds a payment_frequency block; monthly
                    figures are unchanged
                fees:
                  type: number
                  description: >-
                    Upfront fees deducted from the amount the borrower receives
                    (origination, closing). Adds the APR including those fees
              required:
                - loanAmount
                - interestRate
                - loanTerm
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: x-api-key
      in: header
security:
  - api_key: []
sampleRequest:
  loanAmount: 32000
  interestRate: 8.5
  loanTerm: 6
  extraPayment: 100
  startDate: '2026-12-01'
  paymentFrequency: biweekly
  fees: 800
